[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "n8n-workflow-linter"
version = "0.2.0"
description = "Lint n8n workflow JSON exports for leaked credentials, secrets, reliability gaps, and hygiene issues — in CI, with zero runtime dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Redowan Ahmed Farhan" }]
keywords = ["n8n", "workflow", "linter", "ci", "automation", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Redsf/n8n-workflow-linter"
Issues = "https://github.com/Redsf/n8n-workflow-linter/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
n8n-lint = "n8n_linter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
